<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descent Replay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;900&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== tokens ===== */
:root {
  color-scheme: light;
  --page: #d9d4ca;          /* pale concrete */
  --panel: #e6e2d9;
  --ink: #1e1c19;
  --ink-2: #4c473f;
  --ink-3: #6f695f;
  --line: rgba(30,28,25,.14);
  --shaft: #26241f;         /* the hole */
  --room: #cfcac0;          /* lit concrete room */
  --room-2: #bab4a8;
  --seam: #8c8579;
  --lamp: rgba(255, 214, 140, .45);
  --food: #d9992a;
  --food-ink: #3b2905;
  --blood: #a3271e;
  --blood-ink: #ffffff;
  --guard: #2d6a80;
  --night: rgba(10, 12, 24, .5);
  --focus: #1f6fd1;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #6250d6; --s7: #008300; --s8: #e34948;
  --h1: #f4d9d5; --h2: #ecc0b9; --h3: #e3a59c; --h4: #d98a7f; --h5: #cd6f63; --h6: #c05549; --h7: #ad3d32; --h8: #962a20; --h9: #7d1e16; --h10: #63150f;
  --font-display: "Big Shoulders Stencil Display", Impact, "Arial Narrow", sans-serif;
  --font-body: "Archivo", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #1f1e1b; --panel: #282622; --ink: #ece7dc; --ink-2: #bdb6a8; --ink-3: #8f887b; --line: rgba(236,231,220,.12);
    --shaft: #12110f; --room: #3a3833; --room-2: #312f2b; --seam: #5a564e; --lamp: rgba(255, 196, 110, .16);
    --food: #e3a83c; --blood: #d65a4c; --guard: #5fa3bb; --night: rgba(0, 0, 8, .55); --focus: #7db3ff;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #9085e9; --s7: #008300; --s8: #e66767;
    --h1: #43231f; --h2: #552923; --h3: #6a2f27; --h4: #80352b; --h5: #983c2f; --h6: #b04434; --h7: #c4523f; --h8: #d5644f; --h9: #e47a63; --h10: #f2937a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #1f1e1b; --panel: #282622; --ink: #ece7dc; --ink-2: #bdb6a8; --ink-3: #8f887b; --line: rgba(236,231,220,.12);
  --shaft: #12110f; --room: #3a3833; --room-2: #312f2b; --seam: #5a564e; --lamp: rgba(255, 196, 110, .16);
  --food: #e3a83c; --blood: #d65a4c; --guard: #5fa3bb; --night: rgba(0, 0, 8, .55); --focus: #7db3ff;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #9085e9; --s7: #008300; --s8: #e66767;
  --h1: #43231f; --h2: #552923; --h3: #6a2f27; --h4: #80352b; --h5: #983c2f; --h6: #b04434; --h7: #c4523f; --h8: #d5644f; --h9: #e47a63; --h10: #f2937a;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font: 15px/1.5 var(--font-body); min-height: 100vh; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ===== top bar ===== */
.bar {
  position: sticky; top: 0; z-index: 30;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  padding: 10px 16px; background: var(--shaft); color: #ece7dc;
}
.brand { font: 900 28px/1 var(--font-display); letter-spacing: .05em; }
.daybig { font: 900 28px/1 var(--font-display); letter-spacing: .03em; min-width: 92px; color: var(--food); }
.phases { display: flex; gap: 4px; flex-wrap: wrap; }
.phases button {
  border: 1px solid #4d4a43; background: transparent; color: #b9b3a6;
  padding: 3px 10px; border-radius: 999px; font-size: 13px;
}
.phases button.on { background: #ece7dc; color: #1e1c19; border-color: #ece7dc; }
.phases button:disabled { opacity: .35; cursor: default; }
.ctl { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.ctl button, .ctl select, .ctl label.file {
  border: 1px solid #4d4a43; background: transparent; color: #ece7dc; padding: 5px 11px; border-radius: 4px; font-size: 14px;
}
.ctl select { padding: 5px 6px; }
.ctl select option { color: #1e1c19; }
.ctl button:hover, .ctl label.file:hover { background: #33312c; }
.ctl button.primary { background: var(--food); border-color: var(--food); color: var(--food-ink); font-weight: 600; min-width: 74px; }
.ctl label.file { cursor: pointer; }
.ctl label.file input { display: none; }
.ctl .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; border: 0; padding: 0 4px; }

/* ===== timeline strip ===== */
.strip { background: var(--shaft); padding: 0 16px 10px; color: #b9b3a6; }
.strip svg { display: block; width: 100%; height: 46px; cursor: pointer; }
.strip .cap { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; margin-top: 2px; }
@media (max-width: 640px) { .strip .cap span:nth-child(2) { display: none; } }

/* ===== layout ===== */
.layout { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr); }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
.stagewrap { background: var(--shaft); padding: 14px 14px 30px; position: relative; }
.stage { position: relative; margin: 0 auto; max-width: 980px; }

/* floors */
.row { position: absolute; left: 0; right: 0; }
.row .room {
  position: absolute; top: 0; bottom: 6px;
  background:
    radial-gradient(ellipse 60% 70% at 50% 0%, var(--lamp), transparent 70%),
    linear-gradient(var(--room), var(--room-2));
  border-top: 2px solid rgba(255,255,255,.08);
}
.row .slabline { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--seam); }
.row .num {
  position: absolute; top: 0; bottom: 6px; display: grid; place-items: center;
  font: 900 64px/1 var(--font-display); color: var(--ink); opacity: .75;
  background: linear-gradient(var(--room), var(--room-2));
}
.row .hole { position: absolute; top: 0; bottom: 6px; background: var(--shaft); border-left: 3px solid var(--seam); border-right: 3px solid var(--seam); }
.row .bodytag {
  position: absolute; left: 6px; right: 6px; top: 6px; font-size: 11px; line-height: 1.25; color: #f2d6d0;
  background: rgba(120, 30, 22, .7); padding: 3px 5px; border-radius: 3px; text-align: center;
}
.row.empty .room { filter: saturate(.6) brightness(.82); }
.stage.night .row .room, .stage.night .row .num { filter: brightness(.45) saturate(.6); }
.row .room, .row .num { transition: filter .6s ease; }
.row.lit .room { box-shadow: inset 0 0 0 2px var(--food); }

/* platform */
.platform {
  position: absolute; z-index: 6; height: 40px;
  background: linear-gradient(#9b958a, #6c675e); border-top: 3px solid #bdb7ab;
  border-radius: 2px; box-shadow: 0 6px 14px rgba(0,0,0,.45);
  display: flex; align-items: center; gap: 6px; padding: 0 6px;
  transition: transform .42s cubic-bezier(.4,.1,.3,1);
}
.platform .amt { font: 900 22px/1 var(--font-display); color: #fff; min-width: 34px; text-align: right; text-shadow: 0 1px 0 rgba(0,0,0,.4); }
.platform .dots { display: flex; flex-wrap: wrap; gap: 2px; align-content: center; flex: 1; height: 30px; overflow: hidden; }
.platform .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--food); box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
.platform.hidden { opacity: 0; }

/* agents */
.agent {
  position: absolute; left: 0; top: 0; z-index: 8;
  display: flex; align-items: center; gap: 9px;
  transition: transform 1.3s cubic-bezier(.5,0,.25,1), opacity .5s ease;
  border: 0; background: none; padding: 4px; text-align: left; border-radius: 6px;
}
.agent:hover .av, .agent.sel .av { box-shadow: 0 0 0 3px var(--room), 0 0 0 5px var(--ink); }
.agent .av {
  flex: none; width: 46px; height: 46px; border-radius: 50%;
  display: grid; place-items: center; font-weight: 700; font-size: 17px; color: #fff;
  background: var(--c); box-shadow: 0 0 0 2px rgba(0,0,0,.55);
  text-shadow: 0 1px 1px rgba(0,0,0,.45);
  transition: background .5s, transform .5s;
}
.agent .info { display: flex; flex-direction: column; gap: 3px; min-width: 0; width: 132px; }
.agent .nm { display: flex; gap: 6px; align-items: baseline; font-size: 14px; line-height: 1.1; }
.agent .nm b { font-weight: 700; }
.agent .nm span { font-size: 11px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hearts { display: flex; gap: 2px; }
.hearts i { width: 10px; height: 9px; background: rgba(0,0,0,.2); clip-path: path("M5 9 L0.6 4.4 A2.4 2.4 0 0 1 5 1.6 A2.4 2.4 0 0 1 9.4 4.4 Z"); transition: background .4s; }
.hearts i.on { background: var(--blood); }
.hearts i.lost { background: #f5c14d; }
.belly { height: 4px; border-radius: 2px; background: rgba(0,0,0,.2); overflow: hidden; width: 116px; }
.belly span { display: block; height: 100%; background: var(--food); transition: width .5s ease; }
.chips { display: flex; gap: 3px; flex-wrap: wrap; min-height: 18px; }
.chip { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; padding: 1px 5px 1px 3px; border-radius: 3px; background: rgba(0,0,0,.14); color: var(--ink); }
.chip svg { width: 12px; height: 12px; }
.chip.attack { background: var(--blood); color: #fff; }
.chip.guard { background: var(--guard); color: #fff; }
.chip.eat { background: var(--food); color: var(--food-ink); }
.chip.kit { background: #f2f0ea; color: var(--blood); }
.agent.dead .av { background: #6b665d !important; transform: rotate(90deg) scaleY(.82); }
.agent.dead .hearts, .agent.dead .belly, .agent.dead .chips { display: none; }
.agent.dead .nm b { text-decoration: line-through; }
.agent.gone { opacity: 0; pointer-events: none; }
.agent.shake { animation: shake .45s ease 2; }
.agent.lunge-r .av { animation: lungeR .5s ease; }
.agent.lunge-l .av { animation: lungeL .5s ease; }
@keyframes shake { 0%,100% { translate: 0 0; } 25% { translate: -5px 0; } 75% { translate: 5px 0; } }
@keyframes lungeR { 50% { transform: translateX(26px) scale(1.12); } }
@keyframes lungeL { 50% { transform: translateX(-26px) scale(1.12); } }

/* compact (narrow) */
.stage.compact .agent { flex-direction: column; gap: 3px; align-items: center; text-align: center; }
.stage.compact .agent .av { width: 36px; height: 36px; font-size: 14px; }
.stage.compact .agent .info { width: auto; align-items: center; }
.stage.compact .agent .nm span, .stage.compact .belly { display: none; }
.stage.compact .hearts i { width: 7px; height: 7px; clip-path: none; border-radius: 1px; }
.stage.compact .row .num { font-size: 34px; }
.stage.compact .chip { font-size: 10px; padding: 0 3px; }
.stage.compact .chip svg { display: none; }

/* bubbles & floaters */
.bubble {
  position: absolute; z-index: 20; max-width: 300px; padding: 7px 10px; border-radius: 10px;
  background: #fbf8f2; color: #1e1c19; font-size: 13px; line-height: 1.35;
  box-shadow: 0 4px 14px rgba(0,0,0,.35); pointer-events: none;
  animation: pop .22s ease-out;
}
.bubble .txt { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.stage.compact .bubble .txt { -webkit-line-clamp: 3; }
.bubble::after { content: ""; position: absolute; border: 7px solid transparent; }
.bubble.tl::after { left: -7px; top: 18px; border-left: 0; border-right-color: #fbf8f2; }
.bubble.tr::after { right: -7px; top: 18px; border-right: 0; border-left-color: #fbf8f2; }
.bubble.tb::after { left: var(--tail, 24px); bottom: -7px; border-bottom: 0; border-top-color: #fbf8f2; }
.bubble b { display: block; font-size: 11px; color: #6f695f; margin-bottom: 1px; }
.bubble.shout { background: #fff6dc; border: 2px dashed #b47a12; }
.bubble.shout b { color: #8a5a06; }
.bubble.shout.tl::after { border-right-color: #fff6dc; }
.bubble.shout.tr::after { border-left-color: #fff6dc; }
.bubble.shout.tb::after { border-top-color: #fff6dc; }
@keyframes pop { from { transform: scale(.9) translateY(4px); opacity: 0; } }
.float {
  position: absolute; z-index: 22; font: 900 22px/1 var(--font-display); pointer-events: none;
  animation: rise 1.4s ease-out forwards; text-shadow: 0 1px 2px rgba(0,0,0,.5); white-space: nowrap;
}
.float.dmg { color: #ff6b5c; }
.float.food { color: #ffd27a; font-size: 18px; }
.float.block { color: #cfe8f2; font-size: 16px; }
@keyframes rise { from { transform: translateY(6px); opacity: 0; } 15% { opacity: 1; } to { transform: translateY(-34px); opacity: 0; } }
.slash { position: absolute; z-index: 21; height: 4px; background: #ff5545; border-radius: 2px; pointer-events: none; animation: slash .5s ease-out forwards; box-shadow: 0 0 10px #ff5545; }
@keyframes slash { from { transform: scaleX(0) rotate(-18deg); opacity: 1; } 60% { transform: scaleX(1) rotate(-18deg); opacity: 1; } to { transform: scaleX(1) rotate(-18deg); opacity: 0; } }
.banner {
  position: absolute; z-index: 25; left: 50%; top: 18px; transform: translateX(-50%);
  background: #ece7dc; color: #1e1c19; padding: 10px 18px; border-radius: 4px;
  font: 900 26px/1.1 var(--font-display); letter-spacing: .02em; text-align: center;
  box-shadow: 0 8px 24px rgba(0,0,0,.5); animation: pop .3s ease-out; max-width: 90%;
}
.banner small { display: block; font: 500 13px/1.3 var(--font-body); letter-spacing: 0; color: #4c473f; margin-top: 3px; }

/* ===== feed ===== */
.feed { background: var(--panel); padding: 18px 20px 60px; min-width: 0; max-height: calc(100vh - 120px); overflow-y: auto; position: sticky; top: 108px; align-self: start; }
@media (max-width: 900px) { .feed { max-height: none; position: static; } }
.feed h2 { font: 900 44px/1 var(--font-display); margin: 0; letter-spacing: .02em; }
.feed .lede { color: var(--ink-2); margin: 4px 0 6px; max-width: 60ch; }
.sec { border-left: 3px solid transparent; padding: 4px 0 6px 12px; margin: 14px 0 0 -15px; transition: border-color .3s, opacity .3s; }
.sec.now { border-left-color: var(--food); }
.sec.later { opacity: .45; }
.sec h3 { font-size: 13px; font-weight: 700; color: var(--ink-3); margin: 0 0 6px; display: flex; align-items: center; gap: 6px; }
.sec h3 svg { width: 15px; height: 15px; }
.convo { margin: 6px 0 12px; }
.convo .fl { font-size: 12px; color: var(--ink-3); margin: 0 0 4px; }
.msg { display: grid; grid-template-columns: 22px 1fr; gap: 8px; margin: 5px 0; }
.dot { width: 22px; height: 22px; border-radius: 50%; background: var(--c); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
.msg p { margin: 0; max-width: 62ch; }
.msg p b { font-weight: 700; margin-right: 5px; }
.thought { font-size: 13px; color: var(--ink-2); font-style: italic; margin: 1px 0 0; }
.thought svg { width: 11px; height: 11px; vertical-align: -1px; margin-right: 3px; }
.ev { list-style: none; margin: 0; padding: 0; }
.ev li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.ev li.death p { color: var(--blood); font-weight: 600; }
.ev p { margin: 0; }
.plans { display: grid; gap: 6px; }
.plan { display: grid; grid-template-columns: 22px 64px 1fr; gap: 8px; align-items: start; font-size: 13px; }
.plan > span:nth-child(2) { line-height: 22px; }
.plan .bar10 { margin-top: 5px; }
.bar10 { display: flex; height: 12px; gap: 2px; }
.bar10 span { display: block; height: 100%; border-radius: 2px; }
.muted { color: var(--ink-3); font-size: 13px; }
.card { background: rgba(0,0,0,.05); border-radius: 6px; padding: 12px 14px; margin: 0 0 14px; }
.card .top { display: flex; gap: 10px; align-items: center; }
.card .top .dot { width: 32px; height: 32px; font-size: 13px; }
.card pre { white-space: pre-wrap; font: 13px/1.45 var(--font-body); margin: 8px 0 0; color: var(--ink-2); }
.card svg.spark { width: 100%; height: 56px; display: block; margin-top: 8px; }
.closex { margin-left: auto; border: 1px solid var(--line); background: transparent; border-radius: 4px; padding: 2px 8px; font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 8px 0 0; font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1px rgba(0,0,0,.35); }

/* results */
table.lb { border-collapse: collapse; width: 100%; font-size: 14px; margin-top: 6px; }
table.lb th, table.lb td { text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--line); }
table.lb th { font-weight: 600; color: var(--ink-3); font-size: 12px; }
table.lb .n { text-align: right; font-variant-numeric: tabular-nums; }
.heat { margin-top: 10px; position: relative; }
.heat svg { display: block; max-width: 100%; height: auto; }
.heat .tip { position: absolute; pointer-events: none; background: #1e1c19; color: #ece7dc; font-size: 12px; padding: 4px 8px; border-radius: 4px; white-space: nowrap; transform: translate(-50%, -110%); display: none; z-index: 5; }
.ramp { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); margin-top: 6px; }
.ramp span { display: inline-flex; }
.ramp span i { width: 14px; height: 10px; display: block; }

/* welcome */
.welcome { min-height: calc(100vh - 56px); display: grid; place-items: center; background: var(--shaft); color: #ece7dc; padding: 40px 16px; }
.welcome .box { max-width: 520px; }
.welcome h1 { font: 900 96px/0.9 var(--font-display); margin: 0 0 16px; letter-spacing: .03em; }
.welcome p { color: #cfc9bc; }
.welcome code { background: rgba(255,255,255,.1); padding: 1px 5px; border-radius: 3px; font-size: 13px; }
.welcome.drag { outline: 3px dashed var(--food); outline-offset: -18px; }

@media (prefers-reduced-motion: reduce) {
  .agent, .platform, .row .room, .belly span { transition: none !important; }
  .bubble, .float, .slash, .banner, .agent.shake, .agent .av { animation: none !important; }
}
</style>
</head>

    <symbol id="i-plat" viewBox="0 0 16 16"><path fill="currentColor" d="M1 10h14v3H1zM4 6a4 4 0 0 1 8 0v3H4z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 16 16"><path fill="currentColor" d="M4 7V5a4 4 0 0 1 8 0v2h1v8H3V7zm2 0h4V5a2 2 0 0 0-4 0z"/></symbol>
    <symbol id="i-skull" viewBox="0 0 16 16"><path fill="currentColor" d="M8 1a6 6 0 0 0-6 6c0 2 1 3 2 4v3h2v-2h1v2h2v-2h1v2h2v-3c1-1 2-2 2-4a6 6 0 0 0-6-6zM5.5 6.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm5 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/></symbol>
    <symbol id="i-shout" viewBox="0 0 16 16"><path fill="currentColor" d="M2 6h3l6-4v12l-6-4H2zM12.5 5.5a3.5 3.5 0 0 1 0 5l-1-1a2 2 0 0 0 0-3z"/></symbol>
    <symbol id="i-kit" viewBox="0 0 16 16"><path fill="currentColor" d="M6 1h4v5h5v4h-5v5H6v-5H1V6h5z"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 16 16"><path fill="currentColor" d="M11 2l3 3-3 3V6H9L5 11H2V9h2l4-5h3zm0 6l3 3-3 3v-2H8l-1.3-1.6 1.3-1.6L9 10h2z"/></symbol>
  </defs>
</svg>

<div class="bar">
  <div class="brand">DESCENT</div>
  <div class="daybig" id="daybig" hidden>DAY 0</div>
  <div class="phases" id="phases" role="tablist" aria-label="Phase of the day"></div>
  <div class="ctl">
    <span id="playctl" hidden style="display:contents">
      <button id="prevBtn" aria-label="Previous step">Back</button>
      <button id="playBtn" class="primary">Play</button>
      <button id="nextBtn" aria-label="Next step">Step</button>
      <select id="speed" aria-label="Speed"><option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option></select>
      <label class="chk"><input type="checkbox" id="thoughts" checked> Thoughts</label>
      <button id="resultsBtn">Results</button>
    </span>
    <label class="file">Open replay<input type="file" id="file" accept=".json,application/json"></label>
  </div>
</div>
<div class="strip" id="strip" hidden></div>

<div id="app">
  <section class="welcome" id="welcome">
    <div class="box">
      <h1>DESCENT</h1>
      <p>Open a <code>replay.json</code> from your <code>runs/</code> folder, or drop the file anywhere on this page.</p>
      <p>No replay yet? Run <code>python3 -m descent run configs/bots.json</code> first.</p>
    </div>
  </section>
</div>

<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const icon = (id) => `<svg aria-hidden="true"><use href="#i-${id}"/></svg>`;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const PHASES = [
    { key: "talk", label: "Talk", icon: "talk" },
    { key: "plan", label: "Plan", icon: "guard" },
    { key: "fight", label: "Fight", icon: "attack" },
    { key: "platform", label: "Platform", icon: "plat" },
    { key: "night", label: "Night", icon: "rest" },
  ];

  const S = { R: null, frames: [], i: 0, playing: false, timers: [], selected: null, results: false, layout: null };

  // ---------- load ----------
  function load(replay) {
    if (!replay || !Array.isArray(replay.days) || !replay.agents) { alert("That file isn't a Descent replay."); return; }
    S.R = replay;
    S.byId = Object.fromEntries(replay.agents.map((a) => [a.id, a]));
    const groups = [];
    for (const a of replay.agents) { const g = groupOf(a); if (!groups.includes(g)) groups.push(g); }
    S.groups = groups;
    S.color = Object.fromEntries(groups.map((g, i) => [g, `var(--s${(i % 8) + 1})`]));
    S.frames = buildFrames(replay);
    S.i = 0; S.selected = null; S.results = false;
    $("#playctl").hidden = false; $("#playctl").style.display = "contents";
    $("#daybig").hidden = false; $("#strip").hidden = false;
    buildShell();
    goto(0, false);
  }
  const groupOf = (a) => a.model || a.policy;
  const shortGroup = (g) => g.replace(/^[^:]+:/, "").replace(/^bot:/, "bot ");
  const initials = (n) => n.slice(0, 2);
  const nameOf = (id) => S.byId[id]?.name ?? id;

  function readFile(f) { f.text().then((t) => load(JSON.parse(t))).catch(() => alert("Couldn't read that file as JSON.")); }
  $("#file").addEventListener("change", (e) => e.target.files[0] && readFile(e.target.files[0]));
  ["dragover", "dragenter"].forEach((t) => document.addEventListener(t, (e) => { e.preventDefault(); $("#welcome")?.classList.add("drag"); }));
  ["dragleave", "drop"].forEach((t) => document.addEventListener(t, () => $("#welcome")?.classList.remove("drag")));
  document.addEventListener("drop", (e) => { e.preventDefault(); e.dataTransfer.files[0] && readFile(e.dataTransfer.files[0]); });

  // ---------- frames ----------
  // Each frame = a moment of a day with the full state needed to draw it.
  function buildFrames(R) {
    const frames = [];
    const agentIds = R.agents.map((a) => a.id);
    const bodiesFrom = (list) => Object.fromEntries((list || []).map((b) => [b.victim, b]));
    frames.push({ day: 0, phase: "start", state: R.initial, bodies: {}, rec: null });
    let prevBodies = {};
    R.days.forEach((rec, idx) => {
      const prev = R.days[idx - 1];
      const shuffledIn = !!prev?.shuffle;
      const startBodies = shuffledIn ? {} : prevBodies;
      const base = { day: rec.day, rec, shuffledIn };
      frames.push({ ...base, phase: "talk", state: rec.start, bodies: startBodies });
      frames.push({ ...base, phase: "plan", state: rec.start, bodies: startBodies });
      // after combat
      const afterFight = structuredClone(rec.start);
      const fightBodies = { ...startBodies };
      for (const c of rec.combat || []) {
        const s = afterFight[c.defender];
        s.hp = Math.max(0, s.hp - c.damage_hearts * 10);
        s.hearts = s.hp <= 0 ? 0 : Math.max(1, Math.floor(s.hp / 10 + 1e-9));
      }
      for (const d of rec.deaths || []) if (d.cause === "killed") { afterFight[d.id].alive = false; afterFight[d.id].hp = 0; afterFight[d.id].hearts = 0; fightBodies[d.id] = { victim: d.id, floor: d.floor }; }
      if ((rec.combat || []).length) frames.push({ ...base, phase: "fight", state: afterFight, bodies: fightBodies });
      // after eating
      const afterEat = structuredClone(afterFight);
      for (const p of rec.platform || []) for (const [id, amt] of Object.entries(p.taken)) afterEat[id].fullness = Math.min(10, afterEat[id].fullness + amt);
      for (const b of rec.body_eating || []) for (const [id, amt] of Object.entries(b.taken)) afterEat[id].fullness = Math.min(10, afterEat[id].fullness + amt);
      frames.push({ ...base, phase: "platform", state: afterEat, bodies: fightBodies });
      const endBodies = bodiesFrom(rec.bodies);
      frames.push({ ...base, phase: "night", state: rec.end, bodies: endBodies });
      prevBodies = endBodies;
    });
    return frames;
  }

  // ---------- shell ----------
  function buildShell() {
    const app = $("#app");
    app.innerHTML = `
      <div class="layout">
        <div class="stagewrap"><div class="stage" id="stage" aria-label="The tower"></div></div>
        <aside class="feed" id="feed" aria-live="polite"></aside>
      </div>`;
    buildStrip();
    layoutStage();
    new ResizeObserver(() => { layoutStage(); draw(false); }).observe($(".stagewrap"));
  }

  function layoutStage() {
    const stage = $("#stage");
    const W = stage.clientWidth || 800;
    const floors = S.R.rules.floors;
    const compact = W < 640;
    const numW = compact ? 38 : 70;
    const holeW = Math.round(Math.max(compact ? 66 : 104, Math.min(160, W * 0.18)));
    const roomW = (W - numW - holeW) / 2;
    const rowH = compact ? 104 : 116;
    S.layout = { W, numW, holeW, roomW, rowH, compact, floors };
    stage.classList.toggle("compact", compact);
    stage.style.height = floors * rowH + "px";
    stage.innerHTML = "";
    for (let f = 1; f <= floors; f++) {
      const row = document.createElement("div");
      row.className = "row"; row.dataset.floor = f;
      row.style.top = (f - 1) * rowH + "px"; row.style.height = rowH + "px";
      row.innerHTML = `
        <div class="num" style="left:0;width:${numW}px">${f}</div>
        <div class="room" style="left:${numW}px;width:${roomW}px"></div>
        <div class="hole" style="left:${numW + roomW}px;width:${holeW}px"></div>
        <div class="room" style="left:${numW + roomW + holeW}px;right:0"></div>
        <div class="slabline"></div>`;
      stage.appendChild(row);
    }
    const plat = document.createElement("div");
    plat.className = "platform hidden"; plat.id = "platform";
    plat.style.left = numW + roomW + 6 + "px"; plat.style.width = holeW - 12 + "px";
    plat.innerHTML = `<span class="amt"></span><span class="dots"></span>`;
    stage.appendChild(plat);
    S.tokens = {};
    for (const a of S.R.agents) {
      const el = document.createElement("button");
      el.className = "agent gone"; el.dataset.id = a.id;
      el.style.setProperty("--c", S.color[groupOf(a)]);
      el.innerHTML = `<div class="av">${esc(initials(a.name))}</div>
        <div class="info"><div class="nm"><b>${esc(a.name)}</b><span>${esc(shortGroup(groupOf(a)))}</span></div>
        <div class="hearts">${"<i></i>".repeat(10)}</div><div class="belly"><span></span></div><div class="chips"></div></div>`;
      el.addEventListener("click", () => { S.selected = S.selected === a.id ? null : a.id; S.results = false; drawFeed(); markSel(); });
      stage.appendChild(el);
      S.tokens[a.id] = el;
    }
  }

  function slotXY(floor, slot) {
    const L = S.layout;
    const y = (floor - 1) * L.rowH;
    const tokenW = L.compact ? 60 : 190;
    const roomX = slot === 0 ? L.numW : L.numW + L.roomW + L.holeW;
    const x = roomX + Math.max(4, (L.roomW - tokenW) / 2);
    return { x, y: y + (L.compact ? 14 : 22), cx: roomX + L.roomW / 2, top: y };
  }

  // Where each agent stands in a frame: alive agents and bodies, two slots per floor.
  function placements(frame) {
    const out = {};
    const byFloor = {};
    for (const [id, s] of Object.entries(frame.state)) {
      const isBody = !s.alive && frame.bodies[id];
      if (!s.alive && !isBody) continue;
      const floor = isBody && frame.bodies[id].floor ? frame.bodies[id].floor : s.floor;
      (byFloor[floor] ||= []).push({ id, s, body: !!isBody });
    }
    for (const [floor, list] of Object.entries(byFloor)) {
      list.sort((a, b) => a.id.localeCompare(b.id));
      list.slice(0, 2).forEach((item, slot) => { out[item.id] = { floor: +floor, slot, ...item }; });
    }
    return out;
  }

  // ---------- navigation ----------
  const speed = () => +$("#speed").value;
  const later = (fn, ms) => { const t = setTimeout(fn, ms / speed()); S.timers.push(t); return t; };
  const clearTimers = () => { S.timers.forEach(clearTimeout); S.timers = []; };

  function goto(i, animate) {
    clearTimers();
    S.i = Math.max(0, Math.min(S.frames.length - 1, i));
    draw(animate && !reduce);
  }
  function stop() { S.playing = false; $("#playBtn").textContent = "Play"; clearTimers(); }
  function play() {
    if (S.i >= S.frames.length - 1) goto(0, false);
    S.playing = true; $("#playBtn").textContent = "Pause";
    advance();
  }
  function advance() {
    if (!S.playing) return;
    if (S.i >= S.frames.length - 1) return stop();
    goto(S.i + 1, true);
    later(advance, frameDuration(S.frames[S.i]));
  }
  function frameDuration(fr) {
    if (reduce) return 1800;
    if (fr.phase === "talk") {
      const longest = Math.max(0, ...Object.values(fr.rec.talk || {}).map((c) => c.length));
      return 900 + longest * 1700 + (fr.shuffledIn ? 1500 * speed() : 0) + ((fr.rec.shouts || []).length ? 2200 : 0);
    }
    if (fr.phase === "platform") return 700 + S.R.rules.floors * 520;
    if (fr.phase === "fight") return 2200;
    if (fr.phase === "night") return 1700 + (fr.rec.shuffle ? 900 : 0);
    return 1600;
  }
  $("#playBtn").onclick = () => (S.playing ? stop() : play());
  $("#nextBtn").onclick = () => { stop(); goto(S.i + 1, true); };
  $("#prevBtn").onclick = () => { stop(); goto(S.i - 1, false); };
  $("#thoughts").onchange = () => drawFeed();
  $("#resultsBtn").onclick = () => { stop(); S.results = !S.results; S.selected = null; drawFeed(); };
  document.addEventListener("keydown", (e) => {
    if (!S.R || e.target.closest("input, select")) return;
    if (e.key === "ArrowRight") { stop(); goto(S.i + 1, true); }
    else if (e.key === "ArrowLeft") { stop(); goto(S.i - 1, false); }
    else if (e.key === " ") { e.preventDefault(); S.playing ? stop() : play(); }
  });
  const firstFrameOfDay = (d) => S.frames.findIndex((f) => f.day === d);

  // ---------- drawing ----------
  function draw(animate) {
    const fr = S.frames[S.i];
    $("#daybig").textContent = `DAY ${fr.day}`;
    drawPhases(fr);
    drawStripMarker(fr.day);
    clearFx();
    const stage = $("#stage");
    stage.classList.toggle("night", fr.phase === "night");
    drawTokens(fr, animate);
    drawRows(fr);
    drawPlatform(fr, animate);
    if (fr.phase === "talk") drawTalk(fr, animate);
    if (fr.phase === "fight") drawFight(fr, animate);
    if (fr.phase === "talk" && fr.shuffledIn && animate) banner(`Day ${fr.day}`, "Shuffle: everyone alive has been moved to a new floor. All bodies are gone.");
    else if (fr.phase === "start") banner(`${S.R.agents.length} enter the tower`, `${S.R.rules.floors} floors, ${S.R.daily_food} food a day. Press Play.`, animate ? 2600 : 0);
    else if (fr.phase === "night" && fr.rec.deaths?.some((d) => d.cause === "starved") && animate) banner("Night", "Hunger claimed someone.");
    drawFeed();
    markSel();
  }

  function drawPhases(fr) {
    const box = $("#phases");
    if (fr.phase === "start") { box.innerHTML = ""; return; }
    const has = (k) => k !== "fight" || (fr.rec.combat || []).length;
    box.innerHTML = PHASES.map((p) => `<button role="tab" aria-selected="${p.key === fr.phase}" class="${p.key === fr.phase ? "on" : ""}" data-k="${p.key}" ${has(p.key) ? "" : "disabled"}>${p.label}</button>`).join("");
    box.querySelectorAll("button:not(:disabled)").forEach((b) => b.onclick = () => {
      stop();
      const j = S.frames.findIndex((f) => f.day === fr.day && f.phase === b.dataset.k);
      if (j >= 0) goto(j, true);
    });
  }

  function drawTokens(fr, animate) {
    const pl = placements(fr);
    const plan = fr.phase === "plan" || fr.phase === "fight";
    for (const a of S.R.agents) {
      const el = S.tokens[a.id];
      const p = pl[a.id];
      if (!p) { el.classList.add("gone"); el.tabIndex = -1; continue; }
      el.tabIndex = 0;
      const { x, y } = slotXY(p.floor, p.slot);
      if (!animate) { el.style.transition = "none"; requestAnimationFrame(() => (el.style.transition = "")); }
      el.style.transform = `translate(${x}px, ${y}px)`;
      el.classList.remove("gone");
      el.classList.toggle("dead", p.body);
      const s = fr.state[a.id];
      const before = fr.phase === "fight" ? fr.rec.start[a.id]?.hearts ?? s.hearts : s.hearts;
      el.querySelectorAll(".hearts i").forEach((h, k) => { h.className = k < s.hearts ? "on" : k < before ? "lost" : ""; });
      el.querySelector(".belly span").style.width = Math.max(0, Math.min(100, s.fullness * 10)) + "%";
      const chips = el.querySelector(".chips");
      const al = fr.rec?.allocations?.[a.id];
      chips.innerHTML = plan && al && !p.body ? chipHTML(al) : "";
      el.setAttribute("aria-label", `${a.name}, ${p.body ? "dead" : s.hearts + " hearts"}, floor ${p.floor}`);
    }
  }
  function chipHTML(al) {
    const out = [];
    if (al.talk) out.push(`<span class="chip">${icon("talk")}${al.talk}</span>`);
    if (al.shout) out.push(`<span class="chip">${icon("shout")}${al.shout}</span>`);
    if (al.eat) out.push(`<span class="chip eat">${icon("eat")}${al.eat}</span>`);
    if (al.guard) out.push(`<span class="chip guard">${icon("guard")}${al.guard}</span>`);
    if (al.attack) out.push(`<span class="chip attack">${icon("attack")}${al.attack}</span>`);
    if (al.rest) out.push(`<span class="chip">${icon("rest")}${al.rest}</span>`);
    if (al.use_kit) out.push(`<span class="chip kit">${icon("kit")}</span>`);
    return out.join("");
  }

  function drawRows(fr) {
    const pl = placements(fr);
    const occupied = new Set(Object.values(pl).filter((p) => !p.body).map((p) => p.floor));
    const bodyFood = {};
    const list = fr.phase === "night" ? fr.rec?.bodies : fr.phase === "talk" || fr.phase === "plan" ? (fr.shuffledIn ? [] : S.R.days[fr.day - 2]?.bodies) : null;
    for (const b of list || []) bodyFood[b.floor] = b.food;
    document.querySelectorAll("#stage .row").forEach((row) => {
      const f = +row.dataset.floor;
      row.classList.toggle("empty", !occupied.has(f));
      row.classList.remove("lit");
      row.querySelector(".bodytag")?.remove();
      if (bodyFood[f] != null) {
        const t = document.createElement("div");
        t.className = "bodytag"; t.textContent = `Body: ${(+bodyFood[f]).toFixed(1)} food`;
        row.querySelector(".hole").appendChild(t);
      }
    });
  }

  function platY(floor) { const L = S.layout; return (floor - 1) * L.rowH + L.rowH - 52; }
  function setPlatform(food, floor, label) {
    const plat = $("#platform");
    plat.classList.remove("hidden");
    plat.style.transform = `translateY(${platY(floor)}px)`;
    plat.querySelector(".amt").textContent = food.toFixed(1);
    const n = Math.round((food / S.R.daily_food) * 36);
    plat.querySelector(".dots").innerHTML = "<i></i>".repeat(Math.max(0, n));
    plat.setAttribute("aria-label", `Platform at floor ${floor} with ${food.toFixed(1)} food${label ? ", " + label : ""}`);
  }
  function drawPlatform(fr, animate) {
    const plat = $("#platform");
    if (fr.phase !== "platform" && fr.phase !== "night") { plat.classList.add("hidden"); plat.style.transform = `translateY(-60px)`; return; }
    const P = fr.rec.platform;
    if (fr.phase === "night" || !animate) { setPlatform(P.at(-1).left, P.length); return; }
    plat.style.transition = "none";
    setPlatform(P[0].arrived, 1);
    plat.style.transform = `translateY(-60px)`;
    requestAnimationFrame(() => {
      plat.style.transition = "";
      P.forEach((p, k) => {
        later(() => {
          setPlatform(p.arrived, p.floor);
          const row = document.querySelector(`#stage .row[data-floor="${p.floor}"]`);
          document.querySelectorAll("#stage .row").forEach((r) => r.classList.remove("lit"));
          row.classList.add("lit");
          later(() => {
            setPlatform(p.left, p.floor);
            for (const [id, amt] of Object.entries(p.taken)) if (amt > 0.05) floatAt(id, `+${amt.toFixed(1)}`, "food");
          }, 260);
        }, 150 + k * 520);
      });
      later(() => document.querySelectorAll("#stage .row").forEach((r) => r.classList.remove("lit")), 150 + P.length * 520);
    });
  }

  function tokenCenter(id) {
    const el = S.tokens[id];
    const m = /translate\(([-\d.]+)px, ([-\d.]+)px\)/.exec(el.style.transform);
    const x = m ? +m[1] : 0, y = m ? +m[2] : 0;
    return { x: x + (S.layout.compact ? 30 : 27), y: y + (S.layout.compact ? 18 : 27), left: x, top: y };
  }
  function floatAt(id, text, cls) {
    const c = tokenCenter(id);
    const f = document.createElement("div");
    f.className = `float ${cls} fx`; f.textContent = text;
    f.style.left = c.x + 18 + "px"; f.style.top = c.y - 30 + "px";
    $("#stage").appendChild(f);
    setTimeout(() => f.remove(), 1500);
  }
  function clearFx() { document.querySelectorAll("#stage .fx, #stage .bubble, #stage .banner").forEach((e) => e.remove()); document.querySelectorAll("#stage .agent").forEach((e) => e.classList.remove("shake", "lunge-l", "lunge-r")); }
  function banner(title, sub, ms = 2600) {
    const b = document.createElement("div");
    b.className = "banner fx"; b.innerHTML = `${esc(title)}<small>${esc(sub)}</small>`;
    $("#stage").appendChild(b);
    if (ms) later(() => b.remove(), ms);
  }

  function bubble(msg) {
    const id = msg.from;
    const c = tokenCenter(id);
    const L = S.layout;
    const rowTop = Math.floor((c.top + 1) / L.rowH) * L.rowH;
    const b = document.createElement("div");
    b.className = "bubble" + (msg.shout ? " shout" : "");
    b.innerHTML = `<b>${esc(msg.name)}${msg.shout ? ` shouts (${msg.reach} floor${msg.reach > 1 ? "s" : ""} up and down)` : ""}</b><span class="txt">${esc(msg.text)}</span>`;
    $("#stage").appendChild(b);
    if (L.compact) {
      const w = L.W - L.numW - 8;
      b.style.maxWidth = b.style.width = w + "px";
      b.style.left = L.numW + 4 + "px";
      b.style.top = rowTop + 4 + "px";
      b.classList.add("tb");
      const bh = b.offsetHeight;
      if (rowTop + bh + 4 > c.top + 4) b.style.top = rowTop + 2 + "px";
      b.style.setProperty("--tail", Math.max(10, Math.min(w - 24, c.x - L.numW - 10)) + "px");
      return b;
    }
    const avatarL = c.x - 25, avatarR = c.x + 25;
    const leftSlot = c.x < L.numW + L.roomW;
    const w = Math.min(320, leftSlot ? L.W - avatarR - 14 : avatarL - L.numW - 14);
    b.style.maxWidth = w + "px";
    b.style.top = rowTop + 8 + "px";
    if (leftSlot) { b.style.left = avatarR + 10 + "px"; b.classList.add("tl"); }
    else { b.classList.add("tr"); b.style.left = Math.max(L.numW + 4, avatarL - 10 - b.offsetWidth) + "px"; }
    return b;
  }
  function drawTalk(fr, animate) {
    const talk = fr.rec.talk || {};
    const shouts = (fr.rec.shouts || []).map((x) => ({ from: x.from, name: nameOf(x.from), text: x.text, shout: true, reach: x.reach }));
    const shoutDelay = shouts.length ? 2200 : 0;
    if (shouts.length) {
      const start = fr.shuffledIn ? 1500 * speed() : 200;
      if (!animate) { if (!Object.keys(talk).length) shouts.forEach((m) => bubble(m)); }
      else {
        const els = [];
        later(() => shouts.forEach((m) => els.push(bubble(m))), start);
        later(() => els.forEach((e) => e.remove()), start + shoutDelay);
      }
    }
    for (const msgs of Object.values(talk)) {
      if (!animate) { if (msgs.length) bubble(msgs.at(-1)); continue; }
      let cur = null;
      msgs.forEach((m, k) => later(() => { cur?.remove(); cur = bubble(m); }, (fr.shuffledIn ? 1500 * speed() : 300) + shoutDelay + k * 1700));
    }
  }
  function drawFight(fr, animate) {
    const combat = fr.rec.combat || [];
    combat.forEach((c, k) => {
      const run = () => {
        const a = S.tokens[c.attacker], d = S.tokens[c.defender];
        const ac = tokenCenter(c.attacker), dc = tokenCenter(c.defender);
        a.classList.add(dc.x > ac.x ? "lunge-r" : "lunge-l");
        if (c.damage_hearts > 0) {
          d.classList.add("shake");
          const s = document.createElement("div");
          s.className = "slash fx";
          s.style.left = dc.x - 24 + "px"; s.style.top = dc.y + "px"; s.style.width = "48px";
          $("#stage").appendChild(s);
          floatAt(c.defender, `−${c.damage_hearts}`, "dmg");
        } else floatAt(c.defender, "blocked", "block");
      };
      animate ? later(run, 250 + k * 700) : null;
    });
  }

  // ---------- timeline strip ----------
  function buildStrip() {
    const R = S.R, N = R.days.length, total = R.agents.length;
    const W = 1000, H = 46;
    const bw = W / Math.max(1, N);
    let bars = "";
    R.days.forEach((d, k) => {
      const alive = Object.values(d.end).filter((s) => s.alive).length;
      const h = Math.max(2, (alive / total) * (H - 14));
      bars += `<rect x="${k * bw + 0.5}" y="${H - 4 - h}" width="${Math.max(1, bw - 1.5)}" height="${h}" rx="1" fill="#6d685f"><title>Day ${d.day}: ${alive} alive${d.deaths.length ? ", " + d.deaths.map((x) => nameOf(x.id) + (x.cause === "killed" ? " killed" : " starved")).join(", ") : ""}</title></rect>`;
      d.deaths.forEach((x, j) => { bars += `<circle cx="${k * bw + bw / 2}" cy="${5 + j * 7}" r="3" fill="${x.cause === "killed" ? "#ff6b5c" : "#d9992a"}"/>`; });
      if (d.shuffle) bars += `<line x1="${(k + 1) * bw}" x2="${(k + 1) * bw}" y1="0" y2="${H}" stroke="#ece7dc" stroke-dasharray="3 3" stroke-width="1"/>`;
    });
    $("#strip").innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="slider" aria-label="Jump to day" aria-valuemin="0" aria-valuemax="${N}">${bars}<rect id="marker" y="0" height="${H}" width="${Math.max(2, bw)}" fill="rgba(236,231,220,.18)" stroke="#d9992a" stroke-width="1.5"/></svg>
      <div class="cap"><span>Day 1</span><span>Bars: agents alive. Red dot: killed. Amber dot: starved. Dashed line: shuffle.</span><span>Day ${N}</span></div>`;
    const svg = $("#strip svg");
    svg.addEventListener("click", (e) => {
      const r = svg.getBoundingClientRect();
      const d = Math.min(N, Math.max(1, Math.floor(((e.clientX - r.left) / r.width) * N) + 1));
      stop(); goto(firstFrameOfDay(d), false);
    });
  }
  function drawStripMarker(day) {
    const m = $("#marker"); if (!m) return;
    const N = S.R.days.length, bw = 1000 / Math.max(1, N);
    m.setAttribute("x", day ? (day - 1) * bw : -10);
    $("#strip svg").setAttribute("aria-valuenow", day);
  }

  // ---------- feed ----------
  function markSel() { Object.entries(S.tokens).forEach(([id, el]) => el.classList.toggle("sel", id === S.selected)); }
  const dotFor = (id) => { const a = S.byId[id]; return `<span class="dot" style="--c:${S.color[groupOf(a)]}">${esc(initials(a.name))}</span>`; };

  function drawFeed() {
    const feed = $("#feed");
    const fr = S.frames[S.i];
    let html = "";
    if (S.results) { feed.innerHTML = resultsHTML(); wireHeat(); feed.scrollTop = 0; return; }
    if (S.selected) html += agentCard(S.selected, fr);
    if (fr.phase === "start") {
      html += `<h2>The tower</h2><p class="lede">${S.R.agents.length} agents, ${S.R.rules.floors} floors, ${S.R.daily_food} food on the platform each day.</p>`;
      html += legendHTML();
      if ($("#thoughts").checked && S.R.item_thoughts) {
        html += `<div class="sec now"><h3>What they brought</h3>`;
        for (const a of S.R.agents) {
          const t = S.R.item_thoughts[a.id]?.item;
          html += `<div class="msg">${dotFor(a.id)}<p><b>${esc(a.name)}</b>${esc(a.item.replace(/_/g, " "))}${t ? `<span class="thought" style="display:block">${icon("lock")}${esc(t)}</span>` : ""}</p></div>`;
        }
        html += `</div>`;
      }
      feed.innerHTML = html; return;
    }
    const rec = fr.rec;
    const order = ["talk", "plan", "fight", "platform", "night"];
    const cur = order.indexOf(fr.phase);
    const cls = (k) => { const j = order.indexOf(k); return j === cur ? "now" : j > cur ? "later" : ""; };
    const alive = Object.values(rec.start).filter((s) => s.alive).length;
    const future = (k, ic, title) => `<div class="sec later" data-k="${k}"><h3>${icon(ic)}${title}</h3></div>`;
    html += `<h2>Day ${rec.day}</h2><p class="lede">${alive} alive at dawn${fr.shuffledIn ? ", each on a new floor after the shuffle" : ""}.</p>`;
    const god = $("#thoughts").checked;

    // talk
    const floors = Object.keys(rec.talk || {}).map(Number).sort((a, b) => a - b);
    html += `<div class="sec ${cls("talk")}" data-k="talk"><h3>${icon("talk")}Morning talk</h3>`;
    for (const sh of rec.shouts || []) {
      html += `<div class="msg">${dotFor(sh.from)}<p><b>${esc(nameOf(sh.from))}</b><span class="muted">shouted from floor ${sh.floor}, heard ${sh.reach} floor${sh.reach > 1 ? "s" : ""} up and down by ${sh.heard_by.length}:</span> ${esc(sh.text)}</p></div>`;
    }
    if (!floors.length && !(rec.shouts || []).length) html += `<p class="muted">Nobody spoke today.</p>`;
    for (const f of floors) {
      html += `<div class="convo"><div class="fl">Floor ${f}</div>`;
      for (const m of rec.talk[f]) html += `<div class="msg">${dotFor(m.from)}<p><b>${esc(m.name)}</b>${esc(m.text)}</p></div>`;
      html += `</div>`;
    }
    html += `</div>`;

    // plan
    if (cls("plan") === "later") html += future("plan", "guard", "Evening plans");
    else {
    html += `<div class="sec ${cls("plan")}" data-k="plan"><h3>${icon("guard")}Evening plans <span class="muted" style="font-weight:400">secret until revealed</span></h3><div class="plans">`;
    const ids = Object.keys(rec.allocations || {}).sort((a, b) => (rec.start[a].floor - rec.start[b].floor) || a.localeCompare(b));
    for (const id of ids) {
      const al = rec.allocations[id];
      const segs = [["eat", "var(--food)"], ["guard", "var(--guard)"], ["attack", "var(--blood)"], ["rest", "var(--ink-3)"], ["talk", "var(--seam)"], ["shout", "#b47a12"]];
      const bar = segs.map(([k, c]) => al[k] ? `<span style="flex:${al[k]};background:${c}" title="${k} ${al[k]}"></span>` : "").join("");
      const words = segs.filter(([k]) => al[k]).map(([k]) => `${k} ${al[k]}`).join(", ") + (al.use_kit ? ", bandage" : "");
      const th = god ? rec.thoughts?.[id]?.evening : null;
      html += `<div class="plan">${dotFor(id)}<span>${esc(nameOf(id))}</span><div><div class="bar10" aria-label="${words}">${bar}</div><span class="muted">${words}${al.platform_limit != null ? `, takes at most ${(+al.platform_limit).toFixed(1)}` : ""}</span>${th ? `<p class="thought">${icon("lock")}${esc(th)}</p>` : ""}</div></div>`;
    }
    html += `</div></div>`;
    }

    // fight
    if ((rec.combat || []).length && cls("fight") === "later") html += future("fight", "attack", "Fight");
    else if ((rec.combat || []).length) {
      html += `<div class="sec ${cls("fight")}" data-k="fight"><h3>${icon("attack")}Fight</h3><ul class="ev">`;
      for (const c of rec.combat) {
        const killed = rec.deaths.some((d) => d.id === c.defender && d.cause === "killed");
        html += `<li class="${killed ? "death" : ""}">${dotFor(c.attacker)}<p>${esc(nameOf(c.attacker))} attacked ${esc(nameOf(c.defender))}: ${c.attack} against a guard of ${c.guard}. ${c.damage_hearts > 0 ? `${c.damage_hearts} heart${c.damage_hearts > 1 ? "s" : ""} of damage${killed ? ". " + esc(nameOf(c.defender)) + " died." : "."}` : "Fully blocked."}</p></li>`;
      }
      html += `</ul></div>`;
    }

    // platform
    if (cls("platform") === "later") html += future("platform", "plat", "Platform");
    else {
    html += `<div class="sec ${cls("platform")}" data-k="platform"><h3>${icon("plat")}Platform</h3><ul class="ev">`;
    for (const p of rec.platform) {
      const eaters = Object.entries(p.taken).filter(([, v]) => v > 0.05).map(([id, v]) => `${esc(nameOf(id))} ${v.toFixed(1)}`).join(", ");
      html += `<li><span class="dot" style="--c:var(--food);color:var(--food-ink)">${p.floor}</span><p>Arrived with ${p.arrived.toFixed(1)}. ${eaters ? "Ate: " + eaters + "." : "Nobody ate."} Left with ${p.left.toFixed(1)}.</p></li>`;
    }
    for (const b of rec.body_eating || []) for (const [id, amt] of Object.entries(b.taken)) if (amt > 0) html += `<li class="death">${dotFor(id)}<p>${esc(nameOf(id))} ate ${amt.toFixed(1)} food from ${esc(nameOf(b.victim))}'s body.</p></li>`;
    html += `</ul></div>`;
    }

    // night
    if (cls("night") === "later") html += future("night", "rest", "Night");
    else {
    html += `<div class="sec ${cls("night")}" data-k="night"><h3>${icon("rest")}Night</h3><ul class="ev">`;
    for (const k of rec.kit || []) {
      const msg = k.result === "healed" ? `used a bandage and healed ${k.healed_hearts} heart${k.healed_hearts === 1 ? "" : "s"} of wounds. ${k.left} left.`
        : k.result === "no_wounds" ? "reached for a bandage but had no attack wounds to heal." : "reached for a bandage, but the kit is empty.";
      html += `<li>${dotFor(k.id)}<p>${esc(nameOf(k.id))} ${msg}</p></li>`;
    }
    for (const sc of rec.screams || []) {
      html += `<li><span class="dot" style="--c:var(--ink-3)">${icon("shout")}</span><p class="muted">The floors next to floor ${sc.floor} heard a scream, then silence.</p></li>`;
    }
    const starved = rec.deaths.filter((d) => d.cause === "starved");
    for (const d of starved) html += `<li class="death">${dotFor(d.id)}<p>${esc(nameOf(d.id))} starved to death on floor ${d.floor}.</p></li>`;
    const changes = Object.keys(rec.end).filter((id) => rec.start[id]?.alive && rec.end[id].alive && rec.end[id].hearts !== rec.start[id].hearts);
    for (const id of changes) {
      const a = rec.start[id].hearts, b = rec.end[id].hearts;
      html += `<li>${dotFor(id)}<p>${esc(nameOf(id))}: ${a} → ${b} hearts.</p></li>`;
    }
    if (rec.shuffle) html += `<li>${`<span class="dot" style="--c:var(--ink-3)">${icon("shuffle")}</span>`}<p>Day ${rec.day} ends a cycle. Tomorrow everyone wakes up on a new floor.</p></li>`;
    if (!starved.length && !changes.length && !rec.shuffle) html += `<li><span></span><p class="muted">Everyone's hearts held steady.</p></li>`;
    html += `</ul></div>`;
    }
    if (god && rec.thoughts) {
      const morning = Object.entries(rec.thoughts).filter(([, t]) => t.morning);
      if (morning.length && fr.phase === "talk") {
        html += `<div class="sec"><h3>${icon("lock")}Morning thoughts</h3>`;
        for (const [id, t] of morning) html += `<div class="msg">${dotFor(id)}<p><b>${esc(nameOf(id))}</b><span class="thought">${esc(t.morning)}</span></p></div>`;
        html += `</div>`;
      }
    }
    feed.innerHTML = html;
    const now = feed.querySelector(".sec.now");
    if (now && S.lastFeedFrame !== S.i && feed.scrollHeight > feed.clientHeight + 4) {
      const first = now === feed.querySelector(".sec");
      const top = first ? 0 : feed.scrollTop + now.getBoundingClientRect().top - feed.getBoundingClientRect().top - 12;
      feed.scrollTo({ top: Math.max(0, top), behavior: reduce || !S.playing ? "auto" : "smooth" });
    }
    S.lastFeedFrame = S.i;
  }

  function legendHTML() {
    return `<div class="legend">${S.groups.map((g) => `<span><i style="--c:${S.color[g]}"></i>${esc(shortGroup(g))}</span>`).join("")}</div>`;
  }

  function heartsSeries(id) {
    return S.R.days.map((d) => (d.end[id].alive ? d.end[id].hearts : null));
  }
  function agentCard(id, fr) {
    const a = S.byId[id];
    const sum = S.R.summary.agents.find((x) => x.id === id);
    const series = heartsSeries(id);
    const N = series.length, W = 300, H = 56;
    let path = "", started = false;
    series.forEach((v, k) => {
      if (v == null) { started = false; return; }
      const x = N > 1 ? (k / (N - 1)) * (W - 8) + 4 : W / 2, y = H - 6 - (v / 10) * (H - 14);
      path += `${started ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`; started = true;
    });
    const curX = fr.day ? ((fr.day - 1) / Math.max(1, N - 1)) * (W - 8) + 4 : -10;
    const fate = sum.alive ? `Alive at the end with ${sum.final_hearts} hearts` : sum.death_cause === "killed" ? `Killed by ${nameOf(sum.killed_by)} on day ${sum.death_day}` : `Starved on day ${sum.death_day}`;
    let notes = "";
    for (let k = (fr.day || 1) - 1; k >= 0; k--) { const n = S.R.days[k]?.notes?.[id]; if (n) { notes = n; break; } }
    return `<div class="card">
      <div class="top">${dotFor(id)}<div><b>${esc(a.name)}</b> <span class="muted">${esc(shortGroup(groupOf(a)))}, carrying the ${esc(a.item.replace(/_/g, " "))}</span></div><button class="closex" id="closeCard">Close</button></div>
      <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Hearts over time for ${esc(a.name)}">
        <line x1="0" x2="${W}" y1="8" y2="8" stroke="var(--line)"/>
        <line x1="0" x2="${W}" y1="${H - 6}" y2="${H - 6}" stroke="var(--line)"/>
        <line x1="${curX}" x2="${curX}" y1="0" y2="${H}" stroke="var(--food)" stroke-width="1.5"/>
        <path d="${path}" fill="none" stroke="${S.color[groupOf(a)]}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      </svg>
      <p class="muted" style="margin:2px 0 0">Hearts over the whole game (top line is 10). ${esc(fate)}. Kills ${sum.kills}, attacks ${sum.attacks_made}, greed ${sum.greed_index}.</p>
      ${$("#thoughts").checked && notes ? `<pre>${icon("lock")} ${esc(notes)}</pre>` : ""}
    </div>`;
  }
  document.addEventListener("click", (e) => { if (e.target.id === "closeCard") { S.selected = null; drawFeed(); markSel(); } });

  // ---------- results ----------
  function resultsHTML() {
    const R = S.R, Sm = R.summary;
    const groups = Object.entries(Sm.by_group).sort((a, b) => b[1].avg_days_survived - a[1].avg_days_survived || b[1].avg_final_hearts - a[1].avg_final_hearts);
    let h = `<h2>Results</h2><p class="lede">${Sm.days_played} days. ${Sm.alive} alive, ${Sm.deaths_killed} killed, ${Sm.deaths_starved} starved.</p>`;
    h += `<div class="sec now"><h3>By model</h3><table class="lb"><thead><tr><th>Model or bot</th><th class="n">Alive</th><th class="n">Avg days</th><th class="n">Avg hearts</th><th class="n">Kills</th><th class="n">Greed</th></tr></thead><tbody>`;
    for (const [k, g] of groups) h += `<tr><td><span class="legend" style="margin:0"><span><i style="--c:${S.color[k]}"></i>${esc(shortGroup(k))}</span></span></td><td class="n">${g.alive}/${g.agents}</td><td class="n">${g.avg_days_survived}</td><td class="n">${g.avg_final_hearts}</td><td class="n">${g.kills}</td><td class="n">${g.avg_greed_index}</td></tr>`;
    h += `</tbody></table><p class="muted">Greed 1.0 = took exactly a fair ration from the platform on average.</p></div>`;
    h += `<div class="sec now"><h3>Lifelines</h3><p class="muted" style="margin:0">Each row is an agent, each column a day. Darker red means more hearts. Blank means dead.</p><div class="heat" id="heat">${heatSVG()}<div class="tip"></div></div>
      <div class="ramp">1 heart <span>${Array.from({ length: 10 }, (_, k) => `<i style="background:var(--h${k + 1})"></i>`).join("")}</span> 10 hearts</div></div>`;
    if (Sm.models && Object.keys(Sm.models).length) {
      h += `<div class="sec now"><h3>API usage</h3><table class="lb"><thead><tr><th>Model</th><th class="n">Calls</th><th class="n">Tokens in</th><th class="n">Tokens out</th><th class="n">Cost</th></tr></thead><tbody>`;
      for (const [k, u] of Object.entries(Sm.models)) h += `<tr><td>${esc(k)}</td><td class="n">${u.calls}</td><td class="n">${u.input_tokens.toLocaleString()}</td><td class="n">${u.output_tokens.toLocaleString()}</td><td class="n">${u.cost_usd == null ? "n/a" : "$" + u.cost_usd.toFixed(3)}</td></tr>`;
      h += `</tbody></table></div>`;
    }
    return h;
  }
  function heatSVG() {
    const R = S.R, N = R.days.length;
    const order = [...R.agents].sort((a, b) => S.groups.indexOf(groupOf(a)) - S.groups.indexOf(groupOf(b)) || a.name.localeCompare(b.name));
    const labelW = 74, cell = Math.max(3, Math.min(22, 300 / Math.max(1, N))), rowH = 16, gap = 2;
    const W = labelW + N * cell, H = order.length * (rowH + gap);
    let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:100%;height:auto" role="img" aria-label="Hearts per agent per day">`;
    order.forEach((a, r) => {
      const y = r * (rowH + gap);
      s += `<circle cx="6" cy="${y + rowH / 2}" r="5" fill="${S.color[groupOf(a)]}"/><text x="15" y="${y + rowH / 2 + 4}" font-size="11" fill="var(--ink)" font-family="Archivo, sans-serif">${esc(a.name)}</text>`;
      R.days.forEach((d, k) => {
        const st = d.end[a.id];
        const x = labelW + k * cell;
        if (st.alive) s += `<rect x="${x}" y="${y}" width="${Math.max(1, cell - (cell > 5 ? 1 : 0))}" height="${rowH}" fill="var(--h${Math.max(1, Math.min(10, st.hearts))})" data-a="${a.id}" data-d="${d.day}" data-h="${st.hearts}"/>`;
        const death = d.deaths.find((x) => x.id === a.id);
        if (death) s += `<g transform="translate(${x + cell / 2 - 6}, ${y + 2})" color="${death.cause === "killed" ? "var(--blood)" : "var(--food)"}"><svg width="12" height="12"><use href="#i-skull"/></svg></g><rect x="${x}" y="${y}" width="${Math.max(cell, 12)}" height="${rowH}" fill="transparent" data-a="${a.id}" data-d="${d.day}" data-x="${death.cause}"/>`;
      });
    });
    return s + `</svg>`;
  }
  function wireHeat() {
    const heat = $("#heat"); if (!heat) return;
    const tip = heat.querySelector(".tip");
    heat.addEventListener("mousemove", (e) => {
      const t = e.target.closest("[data-a]");
      if (!t) { tip.style.display = "none"; return; }
      const r = heat.getBoundingClientRect();
      const nm = nameOf(t.dataset.a);
      tip.textContent = t.dataset.x ? `${nm}, day ${t.dataset.d}: ${t.dataset.x === "killed" ? "killed" : "starved"}` : `${nm}, day ${t.dataset.d}: ${t.dataset.h} hearts`;
      tip.style.left = e.clientX - r.left + "px"; tip.style.top = e.clientY - r.top + "px"; tip.style.display = "block";
    });
    heat.addEventListener("mouseleave", () => (tip.style.display = "none"));
    heat.addEventListener("click", (e) => {
      const t = e.target.closest("[data-a]"); if (!t) return;
      S.results = false; S.selected = t.dataset.a; goto(firstFrameOfDay(+t.dataset.d), false);
    });
  }

  // ---------- boot ----------
  const src = new URLSearchParams(location.search).get("src");
  if (window.DESCENT_REPLAY) load(window.DESCENT_REPLAY);
  else if (src) fetch(src).then((r) => r.json()).then(load).catch(() => alert("Couldn't load " + src));
})();
</script>
</body>
</html>
